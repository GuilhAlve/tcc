<!DOCTYPE html>
 <html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Front/css/Criarconta.css">
    <link rel="stylesheet" href="/Front/css/identity.css">
    <title>Crie sua conta</title>
  </head>
  <body class="identity-page">

    <div class="topo">
      <h1 class="Titulo-Logo">NexaDesk</h1> 
    </div>
    
      
    <div class="card">
      <form class="form" id="cadastro-form">
      <input name="nome" type="text" placeholder="Digite seu nome completo" required>
      <input name="senha" type="password" placeholder="Digite sua senha" required>
      <input name="email" type="email" placeholder="Digite um email" required>
      <input name="cargo" type="text" placeholder="Informe seu cargo" required>
      <button type="submit">Criar conta</button>
      </form>
      <p id="cadastro-status" role="status" aria-live="polite"></p>

      <a class="cons" href="login.html">
       <button type="button">Já tenho conta</button>
      </a>
    </div>

    <div class="voltar-container">
      <a class="retorno" href="index.html">
        <button type="button">Voltar</button>
      </a>
    </div>
    <script src="/JavaScript/criar_conta.js" defer></script>
  </body>
</html>
